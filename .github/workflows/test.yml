name: Tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  unit:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install .
      - name: Create an Eustace home so the junction tests have a protected target
        run: New-Item -ItemType Directory -Force "$HOME\.eustace" | Out-Null
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  setup-script:
    # Runs the real installer under Windows PowerShell 5.1 on a Python that has no pipx yet.
    # 3.14 on PATH is the normal case; 3.12 on PATH makes the installer go and get its preferred version.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        path-python: ['3.14', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.path-python }}
      - name: Remove pipx so the installer's bootstrap path is the one tested
        shell: pwsh
        run: |
          python -m pip uninstall -y pipx
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('pipx') is not None)"
      - name: Run setup.ps1
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\setup.ps1
      - name: Installed command works
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          eustace --version
      - name: setup.ps1 installed the star font for this user
        shell: powershell
        run: |
          $file = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts\EustaceMono-Regular.ttf"
          if (-not (Test-Path $file)) { Write-Host "setup.ps1 did not install the font."; exit 1 }
          $key = "HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Fonts"
          if ((Get-ItemProperty $key)."Eustace Mono (TrueType)" -ne $file) { exit 1 }
          # remove it, so the update below has to put it back
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          eustace --remove-font
          if (Test-Path $file) { Write-Host "The font file is still there."; exit 1 }
      - name: eustace --update replaces the folder install with this commit
        shell: powershell
        env:
          EUSTACE_UPDATE_NO_PAUSE: "1"   # the update window normally waits for Enter before closing
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          eustace --update $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $log = "$env:USERPROFILE\.eustace\update.log"
          for ($i = 0; $i -lt 120 -and -not (Test-Path $log); $i++) { Start-Sleep -Seconds 5 }
          if (-not (Test-Path $log)) { Write-Host "The update window never finished."; exit 1 }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern "exit=0" -Quiet)) { exit 1 }
          Start-Sleep -Seconds 10
          eustace --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # the update put the star font back
          if (-not (Test-Path "$env:LOCALAPPDATA\Microsoft\Windows\Fonts\EustaceMono-Regular.ttf")) { Write-Host "The update did not install the font."; exit 1 }
          # the install now knows which commit it came from, so asking again installs nothing
          $again = (eustace --update $env:GITHUB_SHA) -join "`n"
          $again
          if ($again -notmatch "Already up to date") { exit 1 }
      - name: eustace --install-font installs the shipped font for this user, and --remove-font removes it
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          eustace --install-font
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $file = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts\EustaceMono-Regular.ttf"
          if (-not (Test-Path $file)) { Write-Host "The font file was not copied."; exit 1 }
          $key = "HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Fonts"
          $registered = (Get-ItemProperty $key)."Eustace Mono (TrueType)"
          if ($registered -ne $file) { Write-Host "Registered as '$registered'"; exit 1 }
          Add-Type -AssemblyName System.Drawing
          $families = (New-Object System.Drawing.Text.InstalledFontCollection).Families | ForEach-Object { $_.Name }
          if ($families -notcontains "Eustace Mono") { Write-Host "Windows does not list the font."; exit 1 }
          eustace --remove-font
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-ItemProperty $key).PSObject.Properties.Name -contains "Eustace Mono (TrueType)") { exit 1 }
      - name: Report which Python the install used
        shell: powershell
        run: |
          Get-ChildItem "$env:USERPROFILE\pipx\venvs", "$env:LOCALAPPDATA\pipx\pipx\venvs" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content (Join-Path $_.FullName "pyvenv.cfg") }
