[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-cli"
version = "1.0.0"
description = "CLI agent for GenAI.mil models with local file, Office, and Outlook tools"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "python-dotenv",
    "truststore",
    "rich",
    "openpyxl",
    "pypdf",
    "python-docx",
    "python-pptx",
    "pywin32"
]

[project.scripts]
eustace = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
