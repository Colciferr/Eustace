[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-cli"
dynamic = ["version"]
description = "CLI agent for GenAI.mil models with local file, Office, and Outlook tools"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "python-dotenv",
    "truststore",
    "rich",
    "openpyxl",
    "pypdf",
    "python-docx",
    "python-pptx",
    "pywin32"
]

[project.scripts]
eustace = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

# Single source of truth: VERSION in cli.py (read statically, without importing the module)
[tool.setuptools.dynamic]
version = {attr = "cli.VERSION"}
