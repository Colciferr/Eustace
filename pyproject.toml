[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-cli"
dynamic = ["version"]
description = "CLI agent for GenAI.mil models with local file, Office, and Outlook tools"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "python-dotenv",
    "truststore",
    "rich",
    "openpyxl",
    "pypdf",
    "python-docx",
    "python-pptx",
    "pywin32",
    "prompt_toolkit",
    # prompt_toolkit needs wcwidth; 0.9+ ships compiled Windows wheels, which application control can block
    "wcwidth<0.9"
]

[project.scripts]
eustace = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

# The persona ships with the package (to <prefix>/share/eustace) so "eustace --update" can offer its changes
[tool.setuptools.data-files]
"share/eustace" = ["system_prompt.md"]

# Single source of truth: VERSION in cli.py (read statically, without importing the module)
[tool.setuptools.dynamic]
version = {attr = "cli.VERSION"}
